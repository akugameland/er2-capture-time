; =====================================================================
;  Easy Red 2 - Capture Time Mod - settings
;  Ayarlar dosyasi
; =====================================================================
;
;  EN: After changing a value, close the game and run "Apply.bat" again.
;  TR: Bir degeri degistirdikten sonra oyunu kapatip "Apply.bat"i tekrar calistirin.

; EN: Capture time of every capture zone, in seconds (1 - 3600).
;     Vanilla missions mostly use 30. Example: 210 = 3.5 minutes.
; TR: Her ele gecirme bolgesinin suresi, saniye cinsinden (1 - 3600).
;     Orijinal gorevlerde cogunlukla 30'dur. Ornek: 210 = 3,5 dakika.
CaptureTime=210

; EN: Easy Red 2 install folder. Leave empty to detect it automatically.
;     Example: GamePath=C:\Program Files (x86)\Steam\steamapps\common\Easy Red 2
; TR: Easy Red 2 kurulum klasoru. Bos birakirsaniz otomatik bulunur.
GamePath=
